<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NexaYield</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="auth-container flex-center">
        <div class="glass-panel auth-box">
            <h2 class="text-center mb-4">Create <span class="text-gradient">Account</span></h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm_password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Referral Code (Optional)</label>
                    <input type="text" id="referral_code" class="form-control">
                </div>
                <div id="error-msg" class="text-danger mb-4 d-none text-center"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
            <p class="text-center mt-4 text-muted">Already have an account? <a href="login.html" class="text-gradient">Login</a></p>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const cpass = document.getElementById('confirm_password').value;
            if(pass !== cpass) {
                showError('Passwords do not match');
                return;
            }
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: pass,
                referral_code: document.getElementById('referral_code').value
            };
            const res = await apiCall('/api/auth/register', 'POST', data);
            if(res.error) showError(res.error);
            else {
                localStorage.setItem('token', res.token);
                localStorage.setItem('role', res.role);
                window.location.href = res.role === 'admin' ? 'admin.html' : 'dashboard.html';
            }
        });
    </script>
</body>
</html>
