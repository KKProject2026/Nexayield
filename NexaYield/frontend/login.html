<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NexaYield</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="auth-container flex-center">
        <div class="glass-panel auth-box">
            <h2 class="text-center mb-4">Welcome <span class="text-gradient">Back</span></h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div id="error-msg" class="text-danger mb-4 d-none text-center"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <p class="text-center mt-4 text-muted">New here? <a href="register.html" class="text-gradient">Register</a></p>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            const res = await apiCall('/api/auth/login', 'POST', data);
            if(res.error) showError(res.error);
            else {
                localStorage.setItem('token', res.token);
                localStorage.setItem('role', res.role);
                if(res.role === 'admin') window.location.href = 'admin.html';
                else window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
